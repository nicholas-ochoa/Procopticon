# Builds, signs and notarizes Procopticon with scripts/release.sh and publishes the disk image as a
# GitHub release tagged v<version>. Run it by hand: Actions ▸ Release ▸ Run workflow, or
#   gh workflow run release.yml -f version=1.2.3
#
# Repository secrets it needs (Settings ▸ Secrets and variables ▸ Actions):
#   DEVELOPER_ID_P12_BASE64    the "Developer ID Application" certificate with its private key,
#                              exported from Keychain Access as a .p12 and base64-encoded
#   DEVELOPER_ID_P12_PASSWORD  the password given to that export
#   NOTARY_APPLE_ID            the Apple ID that notarizes
#   NOTARY_PASSWORD            an app-specific password for it (account.apple.com ▸ Sign-In and Security)
# The notarization team is the certificate's.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, such as 1.2.3
        required: true
        type: string
      draft:
        description: Leave the release as a draft
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - name: Check the version and the secrets
        env:
          GH_TOKEN: ${{ github.token }}
          P12: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::The version must look like 1.2.3, not '$VERSION'."
            exit 1
          fi
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::There is already a release v$VERSION."
            exit 1
          fi
          missing=0
          for name in P12 P12_PASSWORD APPLE_ID NOTARY_PASSWORD; do
            if [ -z "${!name}" ]; then
              missing=1
            fi
          done
          if [ "$missing" = 1 ]; then
            echo "::error::A signing or notarization secret isn't set. The top of release.yml lists them."
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          # The build number is the number of commits.
          fetch-depth: 0

      - name: Test
        run: swift test

      - name: Install the signing certificate
        env:
          P12: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          # A keychain of this run's own, with a password nobody keeps.
          KEYCHAIN="$RUNNER_TEMP/release.keychain-db"
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 7200 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -P "$P12_PASSWORD" -f pkcs12 -k "$KEYCHAIN" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/certificate.p12"
          # Lets codesign use the key without a dialog nobody is there to answer.
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          # In front of the keychains already searched, which each come back as a quoted line.
          SEARCHED=()
          while IFS= read -r line; do
            SEARCHED+=("$(echo "$line" | sed -e 's/^ *"//' -e 's/"$//')")
          done < <(security list-keychains -d user)
          security list-keychains -d user -s "$KEYCHAIN" "${SEARCHED[@]}"
          if ! security find-identity -v -p codesigning "$KEYCHAIN" | grep -q "Developer ID Application"; then
            echo "::error::DEVELOPER_ID_P12_BASE64 holds no valid Developer ID Application certificate."
            exit 1
          fi

      - name: Save the notarization credentials
        env:
          APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: |
          # "Developer ID Application: Name (TEAMID)"
          TEAM_ID="$(security find-identity -v -p codesigning "$KEYCHAIN" \
            | sed -n 's/.*"Developer ID Application: .*(\([A-Z0-9]*\))".*/\1/p' | head -1)"
          xcrun notarytool store-credentials procopticon-notary --apple-id "$APPLE_ID" --team-id "$TEAM_ID" \
            --password "$NOTARY_PASSWORD" --keychain "$KEYCHAIN" >/dev/null

      - name: Build, sign and notarize
        env:
          NOTARY_KEYCHAIN: ${{ env.KEYCHAIN }}
        run: ./scripts/release.sh

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          DRAFT: ${{ inputs.draft }}
        run: |
          DMG="build/Procopticon-$VERSION.dmg"
          SUM="$(shasum -a 256 "$DMG" | cut -d' ' -f1)"
          FLAGS=()
          if [ "$DRAFT" = true ]; then FLAGS+=(--draft); fi
          gh release create "v$VERSION" "$DMG" --target "$GITHUB_SHA" --title "Procopticon $VERSION" \
            --notes "Requires macOS 26 or later. SHA-256 of \`Procopticon-$VERSION.dmg\`: \`$SUM\`" \
            --generate-notes ${FLAGS[@]+"${FLAGS[@]}"}

      - name: Remove the keychain
        if: always()
        run: |
          if [ -n "${KEYCHAIN:-}" ]; then security delete-keychain "$KEYCHAIN" 2>/dev/null || true; fi
